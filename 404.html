<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Working with Another Intelligence</title>
<style>
  :root { --bg:#FAF7EF; --ink:#172139; --muted:#6C7180; --red:#A8322A; --rule:#E3DCCB; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:2rem 16px; text-align:center; line-height:1.6; }
  .wrap { max-width:560px; }
  .code { font-size:.8rem; letter-spacing:.25em; text-transform:uppercase; color:var(--red); margin-bottom:1rem; }
  h1 { font-family:Georgia,"Newsreader",serif; font-size:1.9rem; margin:0 0 .75rem; font-weight:500; }
  p { color:var(--muted); margin:0 0 1.75rem; }
  a.btn { display:inline-block; background:var(--red); color:#fff; text-decoration:none; border-radius:4px; padding:.7rem 1.2rem; font-weight:600; }
  .fr { margin-top:2rem; padding-top:1.25rem; border-top:1px solid var(--rule); font-size:.95rem; }
  .fr a { color:var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page does not exist.</h1>
    <p>Reality check passed: the link is wrong, not you.</p>
    <a class="btn" href="/">Back to the book</a>
    <div class="fr">Cette page n'existe pas. <a href="/fr">Retour au livre</a></div>
  </div>
</body>
</html>
